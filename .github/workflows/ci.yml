name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:

jobs:
    build-test-package:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Package
              run: npm run package

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v7
              with:
                  name: vsduo-vsix
                  path: vsduo-auth-*.vsix
